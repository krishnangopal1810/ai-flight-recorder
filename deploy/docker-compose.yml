services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flight
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: flight
      MINIO_ROOT_PASSWORD: flight-dev-only-password
    volumes:
      - objects:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 flight flight-dev-only-password; do sleep 1; done;
        mc mb --ignore-existing local/flight

  fake-deps:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    entrypoint: ["/flight-fake"]

  flight:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      fake-deps:
        condition: service_started
    environment:
      FLIGHT_HTTP_ADDRESS: 0.0.0.0:7777
      FLIGHT_OTLP_HTTP_ADDRESS: 0.0.0.0:4318
      FLIGHT_OTLP_GRPC_ADDRESS: 0.0.0.0:4317
      FLIGHT_WEB_DIR: /web
      FLIGHT_LATE_SPAN_GRACE: 500ms
      FLIGHT_DATABASE_URL: postgres://flight:flight-dev-only@postgres:5432/flight?sslmode=disable
      FLIGHT_S3_ENDPOINT: http://minio:9000
      FLIGHT_S3_BUCKET: flight
      FLIGHT_S3_ACCESS_KEY: flight
      FLIGHT_S3_SECRET_KEY: flight-dev-only-password
      FLIGHT_LOCAL_BYPASS: "false"
      FLIGHT_INSECURE_DEVELOPMENT: "true"
      FLIGHT_BOOTSTRAP_TOKEN: frt_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      FLIGHT_GATEWAY_IMAGE: "${COMPOSE_PROJECT_NAME}-flight:latest"
      FLIGHT_OCI_EGRESS_NETWORK: "${COMPOSE_PROJECT_NAME}_default"
    # The coordinator requires the engine socket; replayed application
    # containers never receive this mount and always run non-root/capability-free.
    user: "0:0"
    volumes:
      - "${FLIGHT_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock"
    ports:
      - "127.0.0.1:${FLIGHT_HTTP_PORT:-17777}:7777"
      - "127.0.0.1:${FLIGHT_OTLP_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${FLIGHT_OTLP_HTTP_PORT:-14318}:4318"
    healthcheck:
      test: ["CMD", "/flight", "--url", "http://127.0.0.1:7777", "--token", "frt_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA", "capsule", "list", "--limit", "1"]
      interval: 3s
      timeout: 2s
      retries: 30

volumes:
  postgres: {}
  objects: {}
